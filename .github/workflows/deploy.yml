name: deploy to server
on:
  push:
    branches: [main]
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: tell the server there is an update, then wait until it runs the new code
        run: |
          V="${GITHUB_SHA::7}"
          for u in https://k-fast-ai.pages.dev https://k-fast-ai.sfa7al3asme.workers.dev; do
            curl -fsS -m 20 "$u/api/deploy-hook?t=$(date +%s)" && break || true
          done
          for i in $(seq 1 30); do
            sleep 6
            got=$(curl -fsS -m 10 "https://k-fast-ai.pages.dev/api/whoami?t=$(date +%s)" || true)
            echo "$got"
            if echo "$got" | grep -q "\"version\":\"$V\""; then echo "✓ the server runs $V"; sleep 25; echo "DIAG-BEGIN"; curl -fsS -m 30 "https://k-fast-ai.pages.dev/api/diag?t=$(date +%s)" || true; echo; echo "DIAG-END"; exit 0; fi
          done
          echo "✗ the server did not take $V within 3 minutes"; exit 1
